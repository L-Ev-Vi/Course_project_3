[project]
name = "course-project-3"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
psycopg2 = "^2.9.11"
requests = "^2.32.5"
types-requests = "^2.32.4.20260107"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
python-dotenv = "^1.2.1"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.19.1"
black = "^25.12.0"
isort = "^7.0.0"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ['.venv','tests', 'idea', 'git', '.coverage', 'logs']

[tool.isort]
profile = "black"
line_length = 119

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.git
      \.idea
      \.venv
      \.coverage
  )/
)
'''

[[tool.mypy.overrides]]
module = ["psycopg2"]
follow_untyped_imports = true